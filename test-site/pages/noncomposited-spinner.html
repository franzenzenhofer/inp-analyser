<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="inp-expect" content="noncomposited-animation; target=#submit-search; phase=presentation; showSpinnerHandler burns 150 ms and starts a spinner animated on left and width (non-composited, main-thread layout every frame) for 2 s">
<title>noncomposited-spinner</title>
<style>
  #spinner { position: relative; height: 12px; background: #36c; display: none; }
  #spinner.running { display: block; animation: slide 600ms linear infinite; }
  @keyframes slide { from { left: 0; width: 20px; } to { left: 200px; width: 120px; } }
</style></head>
<body>
<h1>Non-composited spinner - animates left and width</h1>
<button id="submit-search" type="button">Search</button>
<p id="out">idle</p>
<div id="spinner"></div>
<script type="module">
  import { busy } from './busy.js';
  const SPIN_MS = 2000;
  const spinner = document.getElementById('spinner');
  const out = document.getElementById('out');
  document.getElementById('submit-search').addEventListener('click', function showSpinnerHandler() {
    spinner.classList.add('running');
    out.textContent = 'loading';
    busy(150);
    setTimeout(function hideSpinner() {
      spinner.classList.remove('running');
      out.textContent = 'done';
    }, SPIN_MS);
  });
</script>
</body></html>
